# nxnative(https://github.com/seedds/nxnative)로 본인 소유 게임의 IPA(iPhone·iPad)와
# Apple Silicon Mac용 네이티브 앱(.app)을 GitHub macOS 러너에서 빌드합니다.
#   platform = ios      → IPA만 (기본)
#   platform = mac-app  → Mac 앱만: s3://<버킷>/ipa/ipa-<번호>/mac/<이름>.app.zip + 릴리스 mac-<번호>
#   platform = both     → IPA를 먼저 만들어 올린 뒤 Mac 앱까지
#
# 준비물 (Settings → Secrets and variables → Actions → New repository secret):
#   PROD_KEYS : 본인 기기에서 뽑은 prod.keys 파일 내용 전체 (텍스트 그대로 붙여넣기)
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY :
#               게임 파일이 든 S3 버킷 nintendo-games-417178828989(us-east-1) 접근용 IAM 자격증명
#
# 기본 동작: 버킷의 uploads/ 에 있는 게임 파일을 전부 받아서 빌드합니다
#            (업로드 사이트에서 올리거나 링크로 추가한 것들).
# 특정 링크 하나만 빌드하려면 실행 시 "game_url" 입력칸에 직접 링크를 넣으면 됩니다(버킷 대신 그 링크 사용).
# 게임 파일 형식: .nsp/.xci/.nsz/.xcz, Switch 2 게임은 .nup (또는 그것들을 담은 .zip / .rar / .7z)
# 그런 다음 Actions → "Build IPA" → Run workflow.
#
# 주의: 공개 저장소에서는 로그와 아티팩트(IPA)를 다른 사람도 볼 수 있습니다. 저장소를 Private로 바꾼 뒤 실행하세요.
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "github = GitHub 맥 러너(디스크 작음), aws-mac = 빌린 EC2 Mac(self-hosted, 디스크 300GB)"
        type: choice
        options: [github, aws-mac]
        default: github
      platform:
        description: "ios = iPhone·iPad IPA, mac-app = Apple Silicon Mac 앱(.app), both = 둘 다"
        type: choice
        options: [ios, mac-app, both]
        default: ios
      game_url:
        description: "특정 링크만 빌드할 때 입력(.nsp/.xci/.nsz/.xcz 또는 .zip/.rar/.7z). 비우면 버킷 uploads/ 의 파일 전부로 빌드"
        default: ""
      nxnative_ref:
        description: nxnative 브랜치/태그/커밋
        default: main
      romfs:
        description: "(IPA만 해당) bundle = 게임 데이터를 IPA에 포함, separate = 제외(IPA가 작아짐). Mac 앱은 항상 포함"
        type: choice
        options: [bundle, separate]
        default: bundle
      language:
        description: 게임 언어 코드 (예 ko, ja, en-GB). 비우면 기본값
        default: ko
      allow_other_metal:
        description: 러너의 Xcode가 27.2가 아닐 때도 셰이더 빌드 진행 (--allow-other-metal)
        type: boolean
        default: true
      mac_gpu:
        description: "(Mac 앱) 미리 만들어 넣을 파이프라인 캐시의 GPU (예 g14s = M2 Max). none = 첫 실행 때 Mac이 직접 만듦(러너 GPU는 실제 Mac과 달라 기본 none)"
        default: none
      mac_seen_shaders:
        description: "(Mac 앱) 플레이 테스트에서 쓰인 셰이더만 빌드(몇 분, 디스크 적게). 목록에 없는 장면은 일부가 안 그려질 수 있음. 끄면 전체(몇 시간)"
        type: boolean
        default: false
      auto_sign:
        description: (IPA만 해당) 빌드가 끝나면 nago-sign 서명기로 바로 서명 시작
        type: boolean
        default: true
      sign_cert:
        description: "자동 서명 인증서 번호 (nago-sign 순서: 0 lily chen, 1 Hassan Aoutouf, 2 Beate Fenster)"
        default: "0"
      romfs_patch:
        description: "게임 데이터 패치(xdelta, 예 한국어 패치) zip의 S3 키 (예 patch/yw4_korpatch_2.2.0.zip). 적용 결과를 patch.zip 으로 올림. 비우면 안 함"
        default: ""
      romfs_patch_password:
        description: 패치 zip 비밀번호 (없으면 비움)
        default: ""

permissions:
  contents: write

# 빌드끼리는 동시에 돌지 않고 줄을 선다(버킷 uploads/ 를 같이 쓰므로)
concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    # aws-mac: EC2 Mac에 등록한 self-hosted 러너(라벨 mac-build). 그 Mac은 빌드 전용이라 디스크 정리·Xcode 삭제를 하지 않는다
    runs-on: ${{ inputs.runner == 'aws-mac' && fromJSON('["self-hosted","macOS","ARM64","mac-build"]') || 'xcode-27' }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      S3_BUCKET: nintendo-games-417178828989
      CF_DOMAIN: d1g40m438o0voh.cloudfront.net
      CF_KEY_ID: K1E111JA4E4O13
    steps:
      - name: 시크릿 확인
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          GAME_URL_INPUT: ${{ inputs.game_url }}
          GAME_URL_SECRET: ${{ secrets.GAME_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          [ -n "$PROD_KEYS" ] || { echo "::error::PROD_KEYS 시크릿이 없습니다"; exit 1; }
          [ -n "$AWS_ACCESS_KEY_ID" ]     || { echo "::error::AWS_ACCESS_KEY_ID 시크릿이 없습니다"; exit 1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::AWS_SECRET_ACCESS_KEY 시크릿이 없습니다"; exit 1; }
          GAME_URL="${GAME_URL_INPUT:-$GAME_URL_SECRET}"
          if [ -n "$GAME_URL" ]; then echo "입력한 링크로 빌드합니다"; else echo "버킷 uploads/ 의 파일로 빌드합니다"; fi

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 진행 상태를 s3://<버킷>/site/build.json 에 남긴다(업로드 사이트가 읽어서 보여 준다)
      #   python3 st.py <state|-> <phase|-> [key=value ...] [logfile=경로 → 마지막 4줄]
      - name: 상태 기록 준비
        env:
          IN_ROMFS: ${{ inputs.romfs }}
          IN_LANG: ${{ inputs.language }}
          IN_PLATFORM: ${{ inputs.platform }}
        run: |
          cat > "$RUNNER_TEMP/st.py" <<'PY'
          import json, os, re, subprocess, sys, time
          p = os.path.join(os.environ["RUNNER_TEMP"], "status.json")
          try:
              s = json.load(open(p))
          except Exception:
              rid = os.environ["GITHUB_RUN_ID"]
              s = {"run_id": rid, "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
                   "url": "%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], rid),
                   "started": time.time(), "romfs": os.environ.get("IN_ROMFS", ""), "language": os.environ.get("IN_LANG", ""),
                   "platform": os.environ.get("IN_PLATFORM", "ios")}
          a = sys.argv[1:]
          if a and a[0] != "-":
              s["state"] = a[0]
          if len(a) > 1 and a[1] != "-":
              s["phase"] = a[1]
          for kv in a[2:]:
              k, _, v = kv.partition("=")
              if k == "logfile":
                  try:
                      lines = [re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", l).rstrip() for l in open(v, errors="replace").read().splitlines()]
                      s["log"] = [l[-200:] for l in lines if l.strip()][-4:]
                  except OSError:
                      pass
              else:
                  s[k] = v
          s["updated"] = time.time()
          json.dump(s, open(p, "w"), ensure_ascii=False)
          subprocess.run(["aws", "s3", "cp", p, "s3://%s/site/build.json" % os.environ["S3_BUCKET"], "--no-progress",
                          "--content-type", "application/json"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          PY
          python3 "$RUNNER_TEMP/st.py" running "준비 중"

      - name: 디스크 공간 확보
        if: inputs.runner != 'aws-mac'
        run: |
          df -h /
          # 사용하지 않는 Xcode, 시뮬레이터 런타임, Android SDK 제거
          ls -d /Applications/Xcode*.app || true
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet/sdk-manifests/*/microsoft.net.sdk.android* 2>/dev/null || true
          xcrun simctl delete all 2>/dev/null || true
          # 시뮬레이터 런타임 디스크 이미지(iOS·watchOS·tvOS·visionOS 한 벌에 수 GB)는 Images/ 에 있어 Profiles 만 지우면 남는다
          xcrun simctl runtime delete all 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* /Library/Developer/CoreSimulator/Images/* 2>/dev/null || true
          # 큰 게임(25GB+)은 원본 + 추출본(RomFS 크기 + 6GB) + 결과물로 80GB 가까이 필요하다.
          # 빌드에 안 쓰는 도구 캐시·브라우저·언어 툴체인을 지운다(python3·aws·brew·dotnet은 건드리지 않음)
          tc="${RUNNER_TOOL_CACHE:-$HOME/hostedtoolcache}"
          for p in "$tc"/CodeQL "$tc"/go "$tc"/node "$tc"/Ruby "$tc"/PyPy "$tc"/Java_* \
                   "$HOME/.rustup" "$HOME/.cargo" "$HOME/.ghcup" "$HOME/.gradle" "$HOME/.m2" \
                   "$HOME/Library/Developer/Xcode/DerivedData" "$HOME/Library/Developer/CoreSimulator" \
                   /Library/Developer/CoreSimulator/Caches \
                   "/Applications/Google Chrome.app" "/Applications/Google Chrome for Testing.app" \
                   /Applications/Firefox.app "/Applications/Microsoft Edge.app" \
                   /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/edge_driver \
                   /usr/local/share/chromedriver-* /usr/local/share/geckodriver \
                   /Library/Developer/Toolchains "$HOME/.swiftly" "$HOME/Library/Developer/Toolchains" \
                   /Library/Frameworks/Mono.framework /Library/Frameworks/Xamarin.iOS.framework \
                   /Library/Frameworks/Xamarin.Mac.framework /Library/Frameworks/Xamarin.Android.framework \
                   /usr/local/miniconda /usr/local/lib/android "/Applications/Visual Studio Code.app" \
                   /Applications/Android\ Studio.app "$HOME/Library/Caches/Homebrew" "$HOME/.npm" "$HOME/.cache"; do
            [ -e "$p" ] || continue
            echo "삭제: $p ($(sudo du -sh "$p" 2>/dev/null | cut -f1))"
            sudo rm -rf "$p" &
          done
          wait
          df -h /

      - name: Xcode 선택 (27.x 우선)
        run: |
          python3 "$RUNNER_TEMP/st.py" running "Xcode·Metal 준비 중"
          pick=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$pick" ] || pick=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$pick" ] || pick=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$pick" ] || pick=/Applications/Xcode.app
          echo "selected: $pick"
          sudo xcode-select -s "$pick/Contents/Developer"
          xcodebuild -version
          # 안 쓰는 Xcode(한 벌에 10GB 이상)를 지운다. 선택본과 DEVELOPER_DIR의 실제 폴더,
          # 그리고 그 폴더를 가리키는 심링크(Xcode_27.2.app → Xcode_27.2.0.app 같은 짝)는 남긴다
          keep1=$(cd "$pick" && pwd -P)
          keep2=$(cd "${DEVELOPER_DIR%/Contents/Developer}" 2>/dev/null && pwd -P || echo "$keep1")
          [ "${{ inputs.runner }}" = aws-mac ] || for x in /Applications/Xcode*.app; do
            real=$(cd "$x" 2>/dev/null && pwd -P || echo "$x")
            [ "$real" = "$keep1" ] || [ "$real" = "$keep2" ] && continue
            if [ -L "$x" ]; then sudo rm -f "$x"; else echo "삭제: $x ($(du -sh "$x" 2>/dev/null | cut -f1))"; sudo rm -rf "$x" & fi
          done
          wait
          ls -ld /Applications/Xcode*.app
          xcodebuild -version
          # Metal 툴체인/iOS 플랫폼 준비(버전 불일치는 --allow-other-metal로 넘어가므로 실패해도 계속)
          xcodebuild -downloadComponent MetalToolchain || true
          [ "${{ inputs.platform }}" = "mac-app" ] || xcodebuild -downloadPlatform iOS || true
          xcrun -sdk iphoneos metal --version || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: nxnative 받기
        run: |
          git clone https://github.com/seedds/nxnative.git nxnative && git -C nxnative checkout "${{ inputs.nxnative_ref }}" && git -C nxnative log -1 --oneline
          # 우리 쪽 추가 패치(예: Level-5 NXGL 셰이더 읽기). 원본이 바뀌어 안 맞으면 경고만 하고 계속
          for p in repo/patches/nxnative/*.patch; do
            [ -f "$p" ] || continue
            if git -C nxnative apply --check "$PWD/$p" 2>/dev/null; then git -C nxnative apply "$PWD/$p" && echo "패치 적용: $p"
            else echo "::warning::패치가 맞지 않아 건너뜀: $p"; fi
          done

      - name: 도구 설치
        run: |
          python3 "$RUNNER_TEMP/st.py" running "도구 설치 중"
          brew install xcodegen zstd glslang sevenzip
          brew install --cask dotnet-sdk || true
          dotnet --version
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r nxnative/.github/requirements/tools.txt
          "$RUNNER_TEMP/venv/bin/pip" install "backports.zstd; python_version < '3.14'"
          # 설치 파일 캐시 비우기(게임 받을 자리 확보)
          brew cleanup -s >/dev/null 2>&1 || true
          rm -rf "$(brew --cache)" "$HOME/Library/Caches/pip" 2>/dev/null || true
          df -h /

      - name: 게임과 키 준비
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          GAME_URL_INPUT: ${{ inputs.game_url }}
          GAME_URL_SECRET: ${{ secrets.GAME_URL }}
          S3_BUCKET: nintendo-games-417178828989
          PREFIX: uploads/
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/st.py" running "게임 파일 받는 중"
          GAME_URL="${GAME_URL_INPUT:-$GAME_URL_SECRET}"
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/game"
          printf '%s\n' "$PROD_KEYS" > "$RUNNER_TEMP/keys/prod.keys"
          cd "$RUNNER_TEMP/game"

          if [ -n "$GAME_URL" ]; then
            echo "링크에서 받기: $GAME_URL"
            curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
                 --speed-limit 204800 --speed-time 120 -o download.bin "$GAME_URL"
          else
            echo "버킷에서 받기: s3://$S3_BUCKET/$PREFIX"
            # CloudFront(무료 1TB)로 받는다. 개인키는 Secrets Manager에서 잠깐 꺼내 쓰고 키 삭제 단계에서 지운다
            aws secretsmanager get-secret-value --region us-east-1 --secret-id nintendo/cloudfront-key --query SecretString --output text > "$RUNNER_TEMP/keys/cf.pem" || true
            CF_KEY_FILE="$RUNNER_TEMP/keys/cf.pem" python3 "$GITHUB_WORKSPACE/repo/tools/cf_get.py" "$PREFIX" .
          fi

          # 받은 것 중 압축(zip/rar/7z)은 풀어서 게임 파일을 꺼냄
          shopt -s nullglob nocaseglob
          for a in download.bin *.zip *.rar *.7z; do
            [ -f "$a" ] || continue
            if 7zz l "$a" >/dev/null 2>&1; then
              echo "압축 해제: $a"
              7zz x -y -o. "$a" && rm -f "$a"
            elif [ "$a" = "download.bin" ]; then
              ext=$(python3 -c "import sys,urllib.parse,os;print(os.path.splitext(urllib.parse.urlparse(sys.argv[1]).path)[1].lower() or '.nsp')" "$GAME_URL")
              mv download.bin "game$ext"
            fi
          done

          # 하위 폴더의 게임 파일을 최상위로
          find . -mindepth 2 -type f \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nsz' -o -iname '*.xcz' -o -iname '*.nup' \) -exec mv {} . \;

          # 빌드 대상 확인
          games=(*.nsp *.xci *.nsz *.xcz *.nup)
          [ ${#games[@]} -gt 0 ] || { echo "::error::빌드할 게임 파일(.nsp/.xci/.nsz/.xcz/.nup)이 없습니다 (버킷 uploads/ 가 비었거나 링크가 잘못됨)"; exit 1; }
          echo "빌드 대상:"; printf ' - %s\n' "${games[@]}"
          df -h /

          # 공간 미리 확인: 빌드 중에는 원본과 추출본(RomFS.img, 원본과 비슷한 크기)이 같이 있고, 그 위에 셰이더가 쌓인다.
          # nxnative 자체 확인은 RomFS + 6GB 뿐이라 Mac 셰이더 전체 빌드(4만 개 넘음)는 몇 시간 돌고 나서야 공간 부족으로 실패한다
          # (run #24: 추출 뒤 약 18GB 남은 상태에서 2시간 39분 컴파일 후 셰이더 라이브러리를 쓰다 실패). 그래서 시작 전에 막는다.
          game_gb=$(du -ck "${games[@]}" | tail -1 | awk '{printf "%d", $1/1048576 + 0.999}')
          free_gb=$(df -k . | awk 'NR==2 {printf "%d", $4/1048576}')
          case "${{ inputs.platform }}/${{ inputs.mac_seen_shaders }}" in
            ios/*)       margin=10 ;;   # IPA: 추출본은 빌드 뒤 지우고(--no-keep-extracted) iOS 셰이더만
            */true)      margin=10 ;;   # Mac 앱, 쓰인 셰이더만
            *)           margin=25 ;;   # Mac 앱, 셰이더 전체
          esac
          need_gb=$(( game_gb + margin ))
          echo "공간: 게임 ${game_gb}GB + 추출본·셰이더 여유 ${margin}GB = 약 ${need_gb}GB 필요, ${free_gb}GB 남음"
          if [ "$free_gb" -lt "$need_gb" ]; then
            msg="디스크 공간 부족 예상: 약 ${need_gb}GB 필요(게임 ${game_gb}GB ×2 정도 + 셰이더), ${free_gb}GB 남음."
            if [ "${{ inputs.platform }}" = ios ]; then
              echo "::warning::$msg 그래도 IPA 빌드는 시도합니다."
            else
              echo "::error::$msg Mac 셰이더 전체 빌드는 몇 시간 뒤 실패하므로 지금 멈춥니다. mac_seen_shaders 를 켜고 다시 실행하세요."
              python3 "$RUNNER_TEMP/st.py" failure "디스크 공간 부족 (${free_gb}GB / 필요 ${need_gb}GB)" || true
              exit 1
            fi
          fi

      - name: IPA 빌드
        if: inputs.platform != 'mac-app'
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/st.py" running "IPA 빌드 중 (nxnative)"
          args=(--romfs "${{ inputs.romfs }}" --progress lines)
          # separate 는 게임 데이터(RomFS.img)를 따로 올려야 해서 추출본을 남긴다(nxnative가 separate 와 --no-keep-extracted 를 같이 쓰면 거부함)
          [ "${{ inputs.romfs }}" = "separate" ] || args+=(--no-keep-extracted)
          [ -n "${{ inputs.language }}" ] && args+=(-l "${{ inputs.language }}")
          [ "${{ inputs.allow_other_metal }}" = "true" ] && args+=(--allow-other-metal)
          mkdir -p "$RUNNER_TEMP/out"
          # 빌드 로그 마지막 줄을 20초마다 사이트로 보낸다
          log="$RUNNER_TEMP/build.log"; : > "$log"
          ( while sleep 20; do python3 "$RUNNER_TEMP/st.py" - - "logfile=$log"; done ) &
          tailer=$!
          rc=0
          "$RUNNER_TEMP/venv/bin/python" -u nxnative/scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" \
            -k "$RUNNER_TEMP/keys/prod.keys" "${args[@]}" 2>&1 | tee "$log" || rc=$?
          kill "$tailer" 2>/dev/null || true
          python3 "$RUNNER_TEMP/st.py" - - "logfile=$log"
          [ "$rc" -eq 0 ] || exit "$rc"
          find "$RUNNER_TEMP/game" -maxdepth 1 -name '*.ipa' -exec mv {} "$RUNNER_TEMP/out/" \;
          ls -la "$RUNNER_TEMP/out"

      # archive: false → zip으로 묶지 않고 .ipa 파일 그대로 올린다(내려받으면 바로 .ipa, 아티팩트 이름 = 파일명)
      # IPA는 크기와 상관없이 항상 S3 ipa/<태그>/ 에 올린다(업로드 사이트·서명기가 여기서 집어 간다).
      # GitHub 릴리스 첨부는 2GiB 미만만 허용되므로, 그 이상이면 릴리스에는 7일짜리 다운로드 링크를 넣는다.
      - name: IPA 올리기 · 릴리스 · 자동 서명
        if: success() && inputs.platform != 'mac-app'
        env:
          PLATFORM: ${{ inputs.platform }}
          GH_TOKEN: ${{ github.token }}
          AUTO_SIGN: ${{ inputs.auto_sign }}
          SIGN_CERT: ${{ inputs.sign_cert }}
          ROMFS: ${{ inputs.romfs }}
        run: |
          set -euo pipefail
          # both 면 이어서 Mac 앱을 만들므로 여기서는 '완료'로 표시하지 않는다
          fin=done; [ "$PLATFORM" = "both" ] && fin=running
          ipa=$(ls "$RUNNER_TEMP"/out/*.ipa 2>/dev/null | head -1)
          [ -n "$ipa" ] || { echo "::error::발행할 IPA가 없습니다"; exit 1; }
          name=$(basename "$ipa")
          size=$(stat -f%z "$ipa")
          tag="ipa-${GITHUB_RUN_NUMBER}"
          key="ipa/${tag}/${name}"
          python3 "$RUNNER_TEMP/st.py" running "IPA 올리는 중 ($(( size / 1024 / 1024 )) MB)"
          aws s3 cp "$ipa" "s3://$S3_BUCKET/$key" --no-progress
          python3 "$RUNNER_TEMP/st.py" - - "ipa_key=$key"

          # separate: 게임 데이터를 ipa/<태그>/romfs.img 로 올린다(아이패드에서 파일 앱으로 앱 폴더에 넣는다).
          # 이름을 romfs.img 로 맞춰 두면 받은 파일을 이름 바꾸지 않고 그대로 옮기면 된다.
          if [ "$ROMFS" = "separate" ]; then
            img=$(find "$RUNNER_TEMP/game" -path '*_build/extract/*' -iname 'romfs.img' -type f 2>/dev/null | head -1)
            if [ -n "$img" ]; then
              isz=$(stat -f%z "$img")
              python3 "$RUNNER_TEMP/st.py" running "게임 데이터 올리는 중 ($(( isz / 1024 / 1024 )) MB)"
              aws s3 cp "$img" "s3://$S3_BUCKET/ipa/${tag}/romfs.img" --no-progress
              python3 "$RUNNER_TEMP/st.py" - - "romfs_key=ipa/${tag}/romfs.img"
            else
              echo "::warning::separate 빌드인데 RomFS.img 를 찾지 못했습니다(게임 데이터를 따로 받을 수 없음)"
            fi
          fi

          notes="서명 안 된 IPA입니다. 업로드 사이트(또는 nago-sign 서명기)에서 서명 후 설치하세요."
          if [ "$size" -lt 2147483648 ]; then
            assets=("$ipa")
          else
            url=$(aws s3 presign "s3://$S3_BUCKET/$key" --expires-in 604800)
            printf '%s\n' "$url" > "$RUNNER_TEMP/download-url.txt"
            assets=("$RUNNER_TEMP/download-url.txt")
            notes="${notes}

          IPA 크기가 $(( size / 1024 / 1024 )) MB로 GitHub 릴리스 한도(2GB)를 넘어 S3에 올렸습니다.
          다운로드 링크(7일 유효): ${url}"
          fi
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "Nintendo IPA ${tag}" --notes "$notes" \
            || gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber \
            || echo "::warning::릴리스 발행 실패(IPA는 S3에 올라가 있음)"

          if [ "$AUTO_SIGN" != "true" ]; then
            python3 "$RUNNER_TEMP/st.py" "$fin" "빌드 완료"
            exit 0
          fi
          python3 "$RUNNER_TEMP/st.py" running "서명 요청 중"
          payload=$(python3 -c 'import json,sys; c=sys.argv[2]; print(json.dumps({"nago_api": "sign", "body": {"source": "s3:" + sys.argv[1], "bundle": "keep", "cert": int(c) if c.isdigit() else 0}}))' "$key" "${SIGN_CERT:-0}")
          job=""
          if aws lambda invoke --region ap-northeast-2 --function-name nago-sign \
               --cli-binary-format raw-in-base64-out --payload "$payload" "$RUNNER_TEMP/sign.json" >/dev/null; then
            job=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("job", ""))' "$RUNNER_TEMP/sign.json" || true)
          fi
          if [ -n "$job" ]; then
            c="${SIGN_CERT:-0}"; case "$c" in *[!0-9]*|"") c=0 ;; esac
            printf '{"job": "%s", "key": "%s", "by": "build", "cert": %s}' "$job" "$key" "$c" \
              | aws s3 cp - "s3://$S3_BUCKET/site/sign/${tag}.json" --content-type application/json
            python3 "$RUNNER_TEMP/st.py" "$fin" "빌드 완료 · 서명 진행 중" "sign_job=$job"
          else
            echo "::warning::자동 서명 요청 실패: $(cat "$RUNNER_TEMP/sign.json" 2>/dev/null || true)"
            python3 "$RUNNER_TEMP/st.py" "$fin" "빌드 완료 (자동 서명 실패 — 사이트에서 서명을 누르세요)"
          fi

      - name: 게임 데이터 패치 만들기 (patch.zip)
        if: inputs.romfs_patch != ''
        env:
          PATCH_KEY: ${{ inputs.romfs_patch }}
          PATCH_PW: ${{ inputs.romfs_patch_password }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/st.py" - "한국어 패치 적용 중"
          brew install xdelta
          img=$(ls "$RUNNER_TEMP"/game/*_build/extract/*/RomFS.img 2>/dev/null | head -1)
          [ -n "$img" ] || { echo "::error::추출된 RomFS.img가 없습니다 (romfs=separate 로 빌드해야 남음)"; exit 1; }
          w="$RUNNER_TEMP/rpatch"; mkdir -p "$w/src" "$w/out/patch"
          [ -f "$RUNNER_TEMP/keys/cf.pem" ] || { mkdir -p "$RUNNER_TEMP/keys"; aws secretsmanager get-secret-value --region us-east-1 --secret-id nintendo/cloudfront-key --query SecretString --output text > "$RUNNER_TEMP/keys/cf.pem" || true; }
          CF_KEY_FILE="$RUNNER_TEMP/keys/cf.pem" python3 "$GITHUB_WORKSPACE/repo/tools/cf_get.py" "$PATCH_KEY" "$w/dl"
          mv "$w/dl/$(basename "$PATCH_KEY")" "$w/patch.zip"; rm -f "$RUNNER_TEMP/keys/cf.pem"
          7zz x -y ${PATCH_PW:+-p"$PATCH_PW"} -o"$w/src" "$w/patch.zip" >/dev/null
          "$RUNNER_TEMP/venv/bin/python" -u repo/tools/apply_xdelta.py "$PWD/nxnative" "$img" "$w/src" "$w/out/patch"
          # 압축 안 함(cpk는 이미 압축돼 있음): 파일 앱에서 풀면 patch 폴더가 생긴다
          (cd "$w/out" && zip -0 -r -q ../patch-out.zip patch)
          ls -la "$w/patch-out.zip"
          aws s3 cp "$w/patch-out.zip" "s3://$S3_BUCKET/ipa/ipa-${{ github.run_number }}/patch.zip" --no-progress
          python3 "$RUNNER_TEMP/st.py" - "한국어 패치 올림"

      # Apple Silicon Mac 앱: nxnative --platform mac-app (Mac 셰이더 + Mac 호스트 + 런처를 담은 더블클릭용 .app).
      # 게임 데이터는 앱 안에 들어가고(--romfs separate 불가), 추출본은 nxnative가 항상 남긴다.
      - name: Mac 앱 빌드 (Apple Silicon)
        if: inputs.platform != 'ios'
        env:
          MAC_GPU: ${{ inputs.mac_gpu }}
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/st.py" running "Mac 앱 빌드 중 (nxnative)"
          # both: IPA는 이미 S3에 있으니 디스크를 비워 둔다
          rm -f "$RUNNER_TEMP"/out/*.ipa
          args=(--platform mac-app --progress lines --gpu "${MAC_GPU:-none}")
          [ -n "${{ inputs.language }}" ] && args+=(-l "${{ inputs.language }}")
          [ "${{ inputs.allow_other_metal }}" = "true" ] && args+=(--allow-other-metal)
          [ "${{ inputs.mac_seen_shaders }}" = "true" ] && args+=(--seen-shaders)
          mkdir -p "$RUNNER_TEMP/out/mac"
          log="$RUNNER_TEMP/build-mac.log"; : > "$log"
          ( while sleep 20; do python3 "$RUNNER_TEMP/st.py" - - "logfile=$log"; done ) &
          tailer=$!
          rc=0
          "$RUNNER_TEMP/venv/bin/python" -u nxnative/scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" \
            -k "$RUNNER_TEMP/keys/prod.keys" "${args[@]}" 2>&1 | tee "$log" || rc=$?
          kill "$tailer" 2>/dev/null || true
          python3 "$RUNNER_TEMP/st.py" - - "logfile=$log"
          [ "$rc" -eq 0 ] || exit "$rc"
          find "$RUNNER_TEMP/game" -maxdepth 1 -name '*.app' -type d -exec mv {} "$RUNNER_TEMP/out/mac/" \;
          ls -la "$RUNNER_TEMP/out/mac"

      # .app 은 폴더라 그대로 올릴 수 없어 ditto 로 zip(서명·심볼릭 링크·권한 유지)한다. Finder에서 더블클릭하면 풀린다.
      - name: Mac 앱 올리기 · 릴리스
        if: success() && inputs.platform != 'ios'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/out/mac" -maxdepth 1 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::만들어진 Mac 앱(.app)이 없습니다"; exit 1; }
          base=$(basename "$app" .app)
          safe=$(printf '%s' "$base" | LC_ALL=C tr -cd 'A-Za-z0-9._-'); [ -n "$safe" ] || safe=game
          zip="$RUNNER_TEMP/out/${safe}.app.zip"
          python3 "$RUNNER_TEMP/st.py" running "Mac 앱 압축 중"
          ditto -c -k --keepParent "$app" "$zip"
          rm -rf "$app"
          size=$(stat -f%z "$zip")
          key="ipa/ipa-${GITHUB_RUN_NUMBER}/mac/${safe}.app.zip"
          python3 "$RUNNER_TEMP/st.py" running "Mac 앱 올리는 중 ($(( size / 1024 / 1024 )) MB)"
          aws s3 cp "$zip" "s3://$S3_BUCKET/$key" --no-progress
          python3 "$RUNNER_TEMP/st.py" - - "mac_key=$key"

          tag="mac-${GITHUB_RUN_NUMBER}"
          notes="Apple Silicon(M1 이후) Mac용 앱입니다. 압축을 풀어 ${base}.app 을 응용 프로그램 폴더로 옮기세요.
          개발자 서명이 없어(ad-hoc) 처음 열 때 macOS가 막습니다. 아래 둘 중 하나로 여세요.
            - 시스템 설정 → 개인정보 보호 및 보안 → '그래도 열기'
            - 터미널: xattr -dr com.apple.quarantine \"/Applications/${base}.app\"
          세이브: ~/Library/Application Support/nxnative/<타이틀 ID>/, 로그: ~/Library/Logs/nxnative/"
          if [ "$size" -lt 2147483648 ]; then
            assets=("$zip")
          else
            url=$(aws s3 presign "s3://$S3_BUCKET/$key" --expires-in 604800)
            printf '%s\n' "$url" > "$RUNNER_TEMP/mac-download-url.txt"
            assets=("$RUNNER_TEMP/mac-download-url.txt")
            notes="${notes}

          앱 크기가 $(( size / 1024 / 1024 )) MB로 GitHub 릴리스 한도(2GB)를 넘어 S3에 올렸습니다.
          다운로드 링크(7일 유효): ${url}"
          fi
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "Nintendo Mac app ${tag}" --notes "$notes" \
            || gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber \
            || echo "::warning::릴리스 발행 실패(Mac 앱은 S3에 올라가 있음)"
          python3 "$RUNNER_TEMP/st.py" done "빌드 완료 ($([ "${{ inputs.platform }}" = both ] && echo 'IPA·Mac 앱' || echo 'Mac 앱'))"

      # prod.keys 는 Mac 앱 빌드까지 쓰므로 모든 빌드가 끝난 뒤 지운다
      - name: 키 삭제
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: 빌드 상태 마무리 (실패·취소)
        if: failure() || cancelled()
        run: python3 "$RUNNER_TEMP/st.py" "${{ job.status }}" - || true

      - name: 실패 시 로그 업로드
        if: failure()
        continue-on-error: true   # GitHub 아티팩트 저장 한도가 차도 빌드를 실패로 만들지 않음
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ${{ runner.temp }}/game/*_build/**/*.log
            ${{ runner.temp }}/game/*_build/**/survey*
          if-no-files-found: ignore
          retention-days: 3

      # 빌린 Mac은 다음 빌드에도 쓰므로 게임 원본·추출본을 지워 디스크를 비운다(로그는 위에서 올린 뒤)
      - name: 게임 파일 정리 (aws-mac)
        if: always() && inputs.runner == 'aws-mac'
        run: rm -rf "$RUNNER_TEMP/game" "$RUNNER_TEMP/out" "$RUNNER_TEMP/keys"
