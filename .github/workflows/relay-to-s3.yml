# 업로드 사이트(nintendo-upload-site)에서 "링크로 추가"한 중계사이트 링크를,
# GitHub 러너가 대신 받아서 "실제 게임 파일"로 nintendo-games 버킷에 올립니다.
#
# 동작:
#   s3://nintendo-games-417178828989/uploads/ 를 정리합니다.
#     1) *.url (링크 포인터): 링크에서 파일을 내려받고,
#        rar/7z 이면 7-Zip(7zz, RAR5 지원)으로 .nsp/.xci/.nsz/.xcz/.nup(Switch 2) 를 꺼내 올림.
#        그 외(zip·게임파일)는 그대로 올림. 성공 시 .url 삭제.
#     2) 버킷에 남은 *.rar / *.7z (직접 업로드분·과거분): 내려받아 풀고
#        게임 파일로 올린 뒤 원본 압축 삭제.
#   다운로드/해제에 실패하면 원본(.url 또는 압축)을 지우지 않고 다음 실행에 재시도합니다.
#   다운로드가 200KB/s 미만으로 120초 이상 지속되면(=사실상 멈춤) 자동 중단하고 재시도로 넘깁니다.
#
# 진행률은 Actions 실행 페이지의 "..." 단계 로그에서 실시간으로 보입니다(curl 진행 막대).
#
# 실행: 5분마다 자동(schedule) / 수동(Run workflow) / repository_dispatch(type: relay-download).
# 업로드 사이트가 "다 받으면 자동 빌드"를 예약해 두면(s3://<버킷>/site/autobuild.json),
# 받을 링크·압축이 모두 끝난 뒤 이 워크플로우가 Build IPA를 시작하고 예약을 지운다.
#
# 필요한 저장소 시크릿: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
name: Relay links to S3

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [relay-download]

concurrency:
  group: relay-download
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 자동 빌드 예약이 있으면 Build IPA 를 시작(gh workflow run)

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      S3_BUCKET: nintendo-games-417178828989
      PREFIX: uploads/
    steps:
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          # RAR5를 확실히 푸는 unrar를 우선, 7-Zip 계열은 보조로 (없어도 실패하지 않음)
          sudo apt-get install -y unrar || true
          sudo apt-get install -y 7zip || true
          sudo apt-get install -y p7zip-full || true
          echo "== 사용 가능한 추출기 =="
          for t in unrar 7zz 7z 7za; do printf '%s: ' "$t"; command -v "$t" || echo "(없음)"; done

      - name: 디스크 공간 확보
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          df -h /

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 링크/압축을 실제 게임 파일로 S3에 정리
        run: |
          set -uo pipefail
          B="$S3_BUCKET"; P="$PREFIX"
          # 큰 게임(Switch 2 NUP 20GB+)은 압축본과 푼 파일을 함께 들고 있어야 하므로 여유가 더 큰 디스크(/mnt 등)에서 작업한다
          wbase="$RUNNER_TEMP"
          if [ -d /mnt ] && sudo mkdir -p /mnt/relay-work && sudo chown "$(id -u):$(id -g)" /mnt/relay-work; then
            a_tmp=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1); a_mnt=$(df -B1 --output=avail /mnt/relay-work | tail -1)
            [ "$a_mnt" -gt "$a_tmp" ] && wbase=/mnt/relay-work
          fi
          work="$wbase/relay"; mkdir -p "$work"
          echo "작업 폴더: $work"; df -h "$work"
          GAME='-iname *.nsp -o -iname *.xci -o -iname *.nsz -o -iname *.xcz -o -iname *.nup'

          # 진행 상태를 s3://<버킷>/site/relay.json 에 남긴다(업로드 사이트가 막대로 보여 준다)
          cat > "$RUNNER_TEMP/rep.py" <<'PY'
          import json, sys, time
          state, phase, name, done, total, t0 = (sys.argv[1:7] + [""] * 6)[:6]
          done, total = int(done or 0), int(total or 0)
          t0 = float(t0 or time.time())
          now = time.time()
          rate = done / max(now - t0, 0.001) if done else 0.0
          eta = (total - done) / rate if rate > 0 and total > done else None
          print(json.dumps({"state": state, "phase": phase, "name": name, "done": done, "total": total,
                            "rate": rate, "eta": eta, "started": t0, "updated": now}, ensure_ascii=False))
          PY
          rep() {  # rep <state> <phase> <name> <받은 바이트> <전체 바이트> <시작 시각>
            python3 "$RUNNER_TEMP/rep.py" "$@" \
              | aws s3 cp - "s3://$B/site/relay.json" --content-type application/json --no-progress >/dev/null 2>&1 || true
          }
          # watch <pid> <파일> <전체 바이트> <단계> <이름>: 백그라운드 작업이 끝날 때까지 4초마다 받은 크기를 기록
          watch() {
            local pid="$1" t0
            t0=$(date +%s)
            while kill -0 "$pid" 2>/dev/null; do
              rep running "$4" "$5" "$(stat -c%s "$2" 2>/dev/null || echo 0)" "$3" "$t0"
              sleep 4
            done
            wait "$pid"
          }
          n_ok=0; n_fail=0; last_err=""

          # 파일 하나 처리: rar/7z면 풀어서 게임파일 업로드, 아니면 그대로 업로드.
          # 사람이 읽는 로그는 stderr로, 업로드 개수만 stdout 마지막 줄로 반환.
          process_file() {
            local f="$1" name="$2" low up=0 g
            low="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            case "$low" in
              *.rar|*.7z)
                echo "압축 해제 중: $name" >&2
                rep running "압축 푸는 중" "$name" 0 0 "$(date +%s)"
                rm -rf ext && mkdir -p ext
                ok=0
                if [ "${low##*.}" = "rar" ] && command -v unrar >/dev/null 2>&1; then
                  unrar x -o+ -y "$f" ext/ >&2 && ok=1
                fi
                if [ "$ok" = 0 ] && command -v 7zz >/dev/null 2>&1; then
                  7zz x -y -oext "$f" >&2 && ok=1
                fi
                if [ "$ok" = 0 ] && command -v 7z  >/dev/null 2>&1; then
                  7z  x -y -oext "$f" >&2 && ok=1
                fi
                if [ "$ok" = 0 ] && command -v 7za >/dev/null 2>&1; then
                  7za x -y -oext "$f" >&2 && ok=1
                fi
                if [ "$ok" = 1 ]; then
                  rm -f "$f"   # 다 풀었으면 압축본은 지워 디스크를 비운다
                  df -h . >&2
                  while IFS= read -r -d '' g; do
                    echo "업로드: $(basename "$g")" >&2
                    rep running "버킷에 올리는 중" "$(basename "$g")" 0 "$(stat -c%s "$g")" "$(date +%s)"
                    aws s3 cp "$g" "s3://$B/$P$(basename "$g")" --no-progress >&2 && up=$((up+1))
                  done < <(find ext -type f \( $GAME \) -print0)
                else
                  echo "::error::압축 해제 실패(추출기 없음 또는 오류): $name" >&2
                fi
                ;;
              *)
                echo "그대로 업로드: $name" >&2
                rep running "버킷에 올리는 중" "$name" 0 "$(stat -c%s "$f")" "$(date +%s)"
                aws s3 cp "$f" "s3://$B/$P$name" --no-progress >&2 && up=1
                ;;
            esac
            echo "$up"
          }

          # 1) 링크(.url) 처리
          keys="$(aws s3api list-objects-v2 --bucket "$B" --prefix "$P" --output json \
                   | jq -r '(.Contents // []) | .[].Key | select(endswith(".url"))')"
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            echo "::group::링크 $key"
            base="$(basename "$key")"; base="${base%.url}"
            url="$(aws s3 cp "s3://$B/$key" - 2>/dev/null | head -n1 | tr -d '\r\n')"
            if [ -z "$url" ]; then echo "::warning::빈 링크"; echo "::endgroup::"; continue; fi
            d="$(mktemp -d "$work/XXXXXX")"; cd "$d"
            # 전체 크기: 사이트가 링크를 추가할 때 알아 둔 값(모르면 0)
            total=$(aws s3api head-object --bucket "$B" --key "$key" --query 'Metadata.size' --output text 2>/dev/null || echo 0)
            case "$total" in ''|*[!0-9]*) total=0 ;; esac
            rep running "다운로드 시작" "$base" 0 "$total" "$(date +%s)"
            curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
                 --speed-limit 204800 --speed-time 120 \
                 -A "Mozilla/5.0" -o "$base" "$url" &
            if watch $! "$base" "$total" "다운로드 중" "$base"; then
              n="$(process_file "$d/$base" "$base" | tail -n1)"
              if [ "${n:-0}" -gt 0 ]; then
                aws s3 rm "s3://$B/$key" && echo "완료: $base (게임파일 ${n}개, 링크 정리)"
                n_ok=$((n_ok+1))
              else
                echo "::warning::$base 처리 결과 없음 — .url 유지"
                n_fail=$((n_fail+1)); last_err="$base: 받은 파일에서 게임 파일을 못 찾음"
              fi
            else
              echo "::warning::다운로드 실패/너무 느림 — .url 유지(다음 실행 재시도): $url"
              n_fail=$((n_fail+1)); last_err="$base: 다운로드 실패 또는 너무 느림"
            fi
            cd "$work"; rm -rf "$d"; echo "::endgroup::"
          done <<< "$keys"

          # 2) 버킷에 남은 압축(.rar/.7z) 처리 (직접 업로드분·과거분)
          arcs="$(aws s3api list-objects-v2 --bucket "$B" --prefix "$P" --output json \
                   | jq -r '(.Contents // []) | .[].Key | select(test("\\.(rar|7z)$"; "i"))')"
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            echo "::group::압축 $key"
            base="$(basename "$key")"
            d="$(mktemp -d "$work/XXXXXX")"; cd "$d"
            echo "S3에서 내려받는 중: $base"
            size=$(aws s3api head-object --bucket "$B" --key "$key" --query 'ContentLength' --output text 2>/dev/null || echo 0)
            case "$size" in ''|*[!0-9]*) size=0 ;; esac
            aws s3 cp "s3://$B/$key" "$d/$base" --no-progress &
            if watch $! "$d/$base" "$size" "버킷에서 압축 파일 받는 중" "$base"; then
              n="$(process_file "$d/$base" "$base" | tail -n1)"
              if [ "${n:-0}" -gt 0 ]; then
                aws s3 rm "s3://$B/$key" && echo "완료: $base 해제 (게임파일 ${n}개, 원본 압축 삭제)"
                n_ok=$((n_ok+1))
              else
                echo "::warning::$base 해제 결과 없음 — 원본 유지"
                n_fail=$((n_fail+1)); last_err="$base: 압축을 풀지 못함"
              fi
            else
              echo "::warning::$base 내려받기 실패"
              n_fail=$((n_fail+1)); last_err="$base: 버킷에서 받기 실패"
            fi
            cd "$work"; rm -rf "$d"; echo "::endgroup::"
          done <<< "$arcs"
          if [ $((n_ok + n_fail)) -gt 0 ]; then
            if [ "$n_fail" -gt 0 ]; then
              rep failed "실패 ${n_fail}개 — 다음 실행에 다시 시도해요 (${last_err})" "" 0 0 "$(date +%s)"
            else
              rep done "다 받았어요 (${n_ok}개)" "" 0 0 "$(date +%s)"
            fi
          fi
          echo "끝"

      - name: 예약된 자동 빌드 시작
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! aws s3 cp "s3://$S3_BUCKET/site/autobuild.json" "$RUNNER_TEMP/auto.json" --no-progress >/dev/null 2>&1; then
            echo "자동 빌드 예약 없음"; exit 0
          fi
          listing="$(aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "$PREFIX" --output json)"
          left=$(printf '%s' "$listing" | jq '[(.Contents // [])[].Key | select(test("\\.(url|rar|7z)$"; "i"))] | length')
          if [ "$left" != "0" ]; then echo "아직 받을 링크·압축 ${left}개 — 다 받은 뒤 시작"; exit 0; fi
          games=$(printf '%s' "$listing" | jq '[(.Contents // [])[].Key | select(test("\\.(nsp|xci|nsz|xcz|nup|zip)$"; "i"))] | length')
          if [ "$games" = "0" ]; then
            echo "::warning::빌드할 게임 파일이 없어 자동 빌드 예약을 취소합니다"
            aws s3 rm "s3://$S3_BUCKET/site/autobuild.json"; exit 0
          fi
          romfs=$(jq -r '.romfs // "bundle"' "$RUNNER_TEMP/auto.json")
          lang=$(jq -r '.language // "ko"' "$RUNNER_TEMP/auto.json")
          case "$romfs" in bundle|separate) ;; *) romfs=bundle ;; esac
          case "$lang" in *[!A-Za-z-]*) lang=ko ;; esac
          cert=$(jq -r '.cert // "0"' "$RUNNER_TEMP/auto.json")
          case "$cert" in 0|1|2) sign=true ;; none) sign=false; cert=0 ;; *) sign=true; cert=0 ;; esac
          aws s3 rm "s3://$S3_BUCKET/site/autobuild.json"
          gh workflow run build-ipa.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f romfs="$romfs" -f language="$lang" -f auto_sign="$sign" -f sign_cert="$cert"
          printf '{"state": "queued", "phase": "빌드 시작 요청됨 (러너 기다리는 중)", "updated": %s, "started": %s}' "$(date +%s)" "$(date +%s)" \
            | aws s3 cp - "s3://$S3_BUCKET/site/build.json" --content-type application/json
          echo "Build IPA 시작 요청 (romfs=$romfs, language=$lang)"
