# 지원 목록에 없는 게임 조사: 버킷 uploads/ 의 게임을 풀어서(nxnative --survey-only)
# 게임 데이터 목록·파일 형식·압축 속 셰이더 표식·실행 파일 문자열을 보고서로 만든다.
# 결과: s3://nintendo-games-417178828989/site/investigate/run-<번호>/ 와 아티팩트 "investigate"
name: Investigate game

on:
  workflow_dispatch:
    inputs:
      nxnative_ref:
        description: nxnative 브랜치/태그/커밋
        default: main
      dump:
        description: "꺼내서 S3에 올릴 RomFS 경로(쉼표로 구분, 예 /data/nx/shader). 비우면 안 꺼냄"
        default: ""
      scan:
        description: 전체 데이터 조사(시간 걸림)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: xcode-27
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      S3_BUCKET: nintendo-games-417178828989
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: nxnative·도구 준비
        run: |
          git clone https://github.com/seedds/nxnative.git nxnative && git -C nxnative checkout "${{ inputs.nxnative_ref }}"
          brew install xcodegen zstd glslang sevenzip
          brew install --cask dotnet-sdk || true
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r nxnative/.github/requirements/tools.txt
          "$RUNNER_TEMP/venv/bin/pip" install "backports.zstd; python_version < '3.14'"

      - name: 게임과 키 준비
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/game"
          printf '%s\n' "$PROD_KEYS" > "$RUNNER_TEMP/keys/prod.keys"
          cd "$RUNNER_TEMP/game"
          aws s3 cp --recursive "s3://$S3_BUCKET/uploads/" . --no-progress
          shopt -s nullglob nocaseglob
          for a in *.zip *.rar *.7z; do 7zz x -y -o. "$a" && rm -f "$a"; done
          find . -mindepth 2 -type f \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nsz' -o -iname '*.xcz' \) -exec mv {} . \;
          ls -la; df -h /

      - name: 전체 추출 (셰이더 단계에서 멈추는 건 정상)
        run: |
          # --survey-only 는 게임 데이터를 풀지 않아서, 일반 빌드를 돌려 추출본(RomFS.img)을 남긴다
          "$RUNNER_TEMP/venv/bin/python" -u nxnative/scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" \
            -k "$RUNNER_TEMP/keys/prod.keys" --romfs separate --allow-other-metal --progress lines 2>&1 | tee "$RUNNER_TEMP/survey.log" || true

      - name: 키 삭제
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: 게임 데이터 조사
        run: |
          out="$RUNNER_TEMP/inv"; mkdir -p "$out"
          b="$RUNNER_TEMP/game"
          find "$b" -maxdepth 4 -not -path '*/romfs/*' | head -120
          if [ -n "${{ inputs.dump }}" ]; then
            for img in "$b"/*_build/extract/*/RomFS.img; do
              "$RUNNER_TEMP/venv/bin/python" -u repo/tools/dump_romfs.py "$PWD/nxnative" "$img" "$out/dump/$(basename "$(dirname "$img")")" "${{ inputs.dump }}" | tail -40
            done
          fi
          # 실행 파일(ExeFS: main, sdk 등) 원본과 압축 푼 이미지 → exefs/ (코드 분석용)
          mkdir -p "$out/exefs"
          for d in "$b"/*_build/extract/*/ExeFS; do
            v=$(basename "$(dirname "$d")"); mkdir -p "$out/exefs/$v"; cp "$d"/* "$out/exefs/$v/" 2>/dev/null || true
            for m in "$d"/main "$d"/sdk; do
              [ -f "$m" ] && "$RUNNER_TEMP/venv/bin/python" -c "import sys;sys.path.insert(0,'nxnative/dm/tools');import nso;d=open(sys.argv[1],'rb').read();m=nso.load(d,sys.argv[1]);open(sys.argv[2],'wb').write(bytes(m.image));print(sys.argv[1],'text_end',hex(m.text_end))" "$m" "$out/exefs/$v/$(basename "$m").img" || true
            done
            "$RUNNER_TEMP/venv/bin/python" nxnative/dm/tools/fps_target.py "$d/main" > "$out/exefs/$v/fps_target.txt" 2>&1 || true
          done
          ls -laR "$out/exefs" | head -40
          [ "${{ inputs.scan }}" = "true" ] && "$RUNNER_TEMP/venv/bin/python" -u repo/tools/investigate.py "$PWD/nxnative" "$b" "$out" 2>&1 | tail -150 || true
          cp "$RUNNER_TEMP/survey.log" "$out/" || true
          find "$b" -path '*_survey/*.md' -type f -exec cp {} "$out/" \; || true
          mkdir -p "$out/logs"; cp -R "$b"/*_build/logs/. "$out/logs/" 2>/dev/null || true
          find "$b" -maxdepth 5 > "$out/tree.txt" || true
          gzip -k "$out/manifest.tsv" 2>/dev/null || true
          aws s3 cp --recursive "$out" "s3://$S3_BUCKET/site/investigate/run-${{ github.run_number }}/" --no-progress --exclude manifest.tsv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigate
          path: ${{ runner.temp }}/inv
          if-no-files-found: warn
